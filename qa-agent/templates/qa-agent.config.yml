# qa-agent filing config: copy to qa/qa-agent.yml. Same schema as sre-agent's config
# (~/src/skills/sre-agent/runtime/src/schemas.ts); qa-agent/scripts/file-findings.sh runs it from the Mac.
autonomy: 1               # file and update issues (fix PRs are a GitHub job; not used for QA)
issueIntro: Bug found by qa-agent's daily exploration of the app.
maxNewIssuesPerRun: 5
lookbackMinutes: 1440     # unused by this source; findings carry their own time
notify:                   # emails Jon via sre-notify with the Mac's Keychain key
  url: https://sre-notify.jonathanrmumm.workers.dev/notify
sources:
  - type: command
    run: node "$GITHUB_ACTION_PATH/src/qa-findings.ts" "$QA_FINDINGS_FILE"
