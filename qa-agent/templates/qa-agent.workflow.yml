# qa-agent's GitHub side: copy to .github/workflows/qa-agent.yml.
# The daily exploration runs on Jon's Mac (tester-army/e2e on his ChatGPT plan) and sends its verified
# findings here with `gh workflow run qa-agent -f findings=...`. This files and updates issues through
# the sre-agent runtime, emails Jon, and at autonomy 2 queues a fix attempt.
name: qa-agent

on:
  workflow_dispatch:
    inputs:
      findings:
        description: Verified findings batch (JSON, qa-agent schema)
        required: true

concurrency:
  group: qa-agent
  cancel-in-progress: false

permissions: {}

jobs:
  file:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      id-token: write
    outputs:
      fix_issues: ${{ steps.file.outputs.fix_issues }}
    env:
      QA_FINDINGS_FILE: /tmp/qa-findings.json
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Save the findings batch
        env:
          FINDINGS: ${{ inputs.findings }}
        run: printf '%s' "$FINDINGS" > "$QA_FINDINGS_FILE"
      - id: file
        uses: jonmumm/skills/sre-agent/runtime@__SKILLS_SHA__
        with:
          config: .github/qa-agent.yml

  fix:
    needs: file
    if: needs.file.outputs.fix_issues != '' && needs.file.outputs.fix_issues != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.file.outputs.fix_issues) }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are the fix step of qa-agent for ${{ github.repository }}. Work only on issue #${{ matrix.issue }}.
            It was found by an AI explorer driving the app and confirmed locally with a failing test. The issue
            lists the expected and actual behavior and the reproduction steps.

            1. Read the issue: `gh issue view ${{ matrix.issue }}`. Read CLAUDE.md and follow the repo's conventions
               and feedback commands.
            2. Write a test that reproduces the bug from those steps (an e2e test if the repo has tester-army/e2e
               set up, otherwise the lowest-level test that shows it) and confirm it fails.
            3. Find the root cause and make the smallest fix. Confirm the test passes and every feedback command passes.
            4. Only then open a PR from branch `qa-agent/issue-${{ matrix.issue }}` titled
               "fix: <what was wrong> (qa-agent #${{ matrix.issue }})" with "Fixes #${{ matrix.issue }}", the root cause,
               the test and the risk. Never merge.
            5. If you cannot reproduce it, or the fix needs a product decision, comment on the issue instead with what
               you found, file:line evidence and the suggested next step.

            Do not edit anything under .github/, and do not change existing tests to make them pass.
          claude_args: |
            --max-turns 60
            --allowedTools Read,Edit,Write,Glob,Grep,Bash(pnpm:*),Bash(node:*),Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*)
